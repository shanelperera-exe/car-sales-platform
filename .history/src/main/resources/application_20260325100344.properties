spring.application.name=redrive-admin-panel
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/redrive_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:redrive_user}
spring.datasource.password=${DB_PASSWORD:redrive123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
server.error.include-message=always
